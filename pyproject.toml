[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bfi-adapt"
dynamic = ["version"]
description = "Evaluation toolkit for Big Five personality adaptation in LLM agents"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
keywords = []
authors = [
  { name = "M. Wang" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "numpy>=1.26.0",
    "openai>=2.2.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "requests>=2.32.4",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
google = ["google-genai>=0.5.0"]
local = ["vllm>=0.8.0", "modelscope>=1.34.0", "huggingface-hub>=0.36.0", "nvitop>=1.6.1"]
all-llm = ["anthropic>=0.40.0", "google-genai>=0.5.0"]

[project.urls]
Documentation = "https://github.com/sci-m-wang/BFI-Adapt#readme"
Issues = "https://github.com/sci-m-wang/BFI-Adapt/issues"
Source = "https://github.com/sci-m-wang/BFI-Adapt"

[tool.hatch.version]
path = "src/persona_change_consistence/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/persona_change_consistence tests}"

[tool.coverage.run]
source_pkgs = ["persona_change_consistence", "tests"]
branch = true
parallel = true
omit = [
  "src/persona_change_consistence/__about__.py",
]

[tool.coverage.paths]
persona_change_consistence = ["src/persona_change_consistence", "*/persona-change-consistence/src/persona_change_consistence"]
tests = ["tests", "*/persona-change-consistence/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
